      - "outdoor"
      - "architecture"
      - "modernist"
    accessibility_notes: |
      Wide sidewalks. Individual buildings have varying accessibility.

  - id: "ven_museu_ceramica"
    name: "Museu de Ceràmica"
    description: |
      Museum showcasing Catalan ceramics from medieval times to contemporary,
      located in the beautiful Palau Reial de Pedralbes.
    address: "Av. Diagonal, 686, 08034 Barcelona, Spain"
    latitude: 41.3897
    longitude: 2.1141
    neighborhood: "Pedralbes"
    type: "museum"
    website_url: "https://www.museudeldisseny.cat"
    opening_hours: "10:00–18:00"
    price_range: "€"
    contact_email: "info@museudeldisseny.cat"
    contact_phone: "+34 93 256 68 00"
    tags:
      - "ceramics"
      - "museum"
      - "historical"
    accessibility_notes: |
      Accessible entrance and elevator. Beautiful gardens also accessible.

  - id: "ven_hangar"
    name: "Hangar"
    description: |
      Contemporary art production center providing workspace and support
