    contact_phone: "+34 93 308 40 41"
    tags:
      - "contemporary"
      - "art-space"
      - "experimental"
    accessibility_notes: |
      Ground floor accessible. Call ahead for specific event accessibility.

  - id: "ven_caixaforum"
    name: "CaixaForum Barcelona"
    description: |
      Cultural and exhibition center in a restored Modernist textile factory,
