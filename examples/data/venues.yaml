    latitude: 41.3833
    longitude: 2.1667
    neighborhood: "El Raval"

    type: "museum"
    website_url: "https://www.macba.cat"
    opening_hours: "10:00–20:00"
    price_range: "€€"
    contact_email: "info@macba.cat"
    contact_phone: "+34 93 412 08 10"

    tags:
      - "contemporary"
      - "museum"
      - "popular"

    accessibility_notes: |
      Step-free entrance available via main door. Accessible bathrooms on all floors.
      Elevators to all exhibition spaces.