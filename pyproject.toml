[project]
name = "bcn-art-compass"
version = "0.1.0"
description = "AI Art Guide - Multi-agent cultural events recommender"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.119.0",
    "google-adk>=1.19.0",
    "google-cloud-aiplatform>=1.128.0",
    "google-cloud-firestore>=2.21.0",
    "google-cloud-storage>=3.4.1",
    "google-generativeai>=0.8.5",
    "httpx>=0.28.1",
    "pydantic>=2.12.4",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "structlog>=25.5.0",
    "uvicorn>=0.38.0",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
local = [
    "chromadb>=1.3.5",
    "ollama>=0.6.1",
    "sentence-transformers>=5.1.2",
]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "api*", "memory*", "rag*", "observability*", "evaluation*"]
exclude = ["tests*", "data*", "generated*", "terraform*", "storage*", "scripts*"]


[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.black]
line-length = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]
