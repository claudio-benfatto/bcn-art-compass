[project]
name = "bcn-art-compass"
version = "0.1.0"
description = "AI Art Guide - Multi-agent cultural events recommender"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.3.5",
    "fastapi>=0.121.3",
    "google-generativeai>=0.8.5",
    "httpx>=0.28.1",
    "pydantic>=2.12.4",
    "pytest>=9.0.1",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.1.2",
    "structlog>=25.5.0",
    "uvicorn>=0.38.0",
]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.black]
line-length = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]
